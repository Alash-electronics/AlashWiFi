sentence=Easy Wi-Fi library for ESP32 and ESP8266: clear error reasons, auto-reconnect, saved network and a phone setup portal like WiFiManager.
paragraph=Connects an ESP32 or ESP8266 to Wi-Fi with wifi.begin(name, password) and tells why it failed (network not found, wrong password, 5 GHz network, weak signal) in Russian, Kazakh or English. wifi.autoConnect() opens a setup page on your phone the first time, saves the network and reconnects by itself afterwards, with growing retry delays. Includes a network scanner and a diagnose() helper. Needs only the built-in WiFi, WebServer and DNSServer libraries. Examples included, made for classes and kits by Alash Electronics.
